# Server Configuration (Port 8080 acts as the main front door)
server.port=8080

# Application Name
spring.application.name=api-gateway

# Spring Cloud Gateway & Eureka Routing Rules
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Route for Auth Service
spring.cloud.gateway.routes[0].id=auth-service-route
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Route for User Service
spring.cloud.gateway.routes[1].id=user-service-route
spring.cloud.gateway.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**, /internal/user/**

# Route for Job Service
spring.cloud.gateway.routes[2].id=job-service-route
spring.cloud.gateway.routes[2].uri=lb://JOB-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/jobs/**

# Route for Bidding Service
spring.cloud.gateway.routes[3].id=bidding-service-route
spring.cloud.gateway.routes[3].uri=lb://BIDDING-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/bids/**

# Route for Escrow Service
spring.cloud.gateway.routes[4].id=escrow-service-route
spring.cloud.gateway.routes[4].uri=lb://ESCROW-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/escrow/**

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Add the exact same secret you used in your Auth Service
jwt.secret=dGhpcz9zQVNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9uT25seURvTm90U2hhcmU=

# Apply the filter to the specific routes that require authentication
spring.cloud.gateway.routes[1].filters[0]=AuthenticationFilter
spring.cloud.gateway.routes[2].filters[0]=AuthenticationFilter
spring.cloud.gateway.routes[3].filters[0]=AuthenticationFilter
spring.cloud.gateway.routes[4].filters[0]=AuthenticationFilter